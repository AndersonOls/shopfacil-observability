global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: shopfacil

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'gateway:3000'
          - 'catalog:3001'
          - 'inventory:3002'
          - 'payment:3003'
          - 'orders:3004'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '$1'

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:3000/health
          - http://catalog:3001/health
          - http://inventory:3002/health
          - http://payment:3003/health
          - http://orders:3004/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
